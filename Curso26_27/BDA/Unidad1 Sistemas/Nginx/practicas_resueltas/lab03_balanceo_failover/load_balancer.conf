upstream ai_inference_cluster {
    # Algoritmo de conexiones mínimas (ideal para inferencia de IA)
    least_conn;

    # Nodo 1: Servidor principal potente (weight=2)
    server 127.0.0.1:8001 weight=2 max_fails=2 fail_timeout=5s;

    # Nodo 2: Servidor secundario estándar (weight=1)
    server 127.0.0.1:8002 weight=1 max_fails=2 fail_timeout=5s;

    # Nodo 3: Servidor en RESERVA (Hot Standby / Backup)
    # Solo recibirá tráfico si el Nodo 1 y el Nodo 2 caen a la vez
    server 127.0.0.1:8003 backup;

    # Conexiones persistentes para reducir latencia
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://ai_cluster;
        proxy_set_header Host $host;

        # Conmutación inmediata si un backend responde con error o timeout
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Keepalive obligatorio
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
