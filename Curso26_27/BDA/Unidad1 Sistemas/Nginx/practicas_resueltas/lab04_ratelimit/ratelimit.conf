# Zona de memoria compartida para 160.000 IPs a 5 peticiones/segundo
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

# Responder con el código HTTP estándar para abuso / exceso de tasa
limit_req_status 429;

server {
    listen 8080;
    server_name localhost;

    # Endpoint protegido con Rate Limiting estricto
    location /api/infer/ {
        # burst=5: Permite una ráfaga inmediata de 5 peticiones
        # nodelay: Procesa la ráfaga al instante sin meter latencia artificial
        limit_req zone=ai_limit burst=5 nodelay;

        default_type application/json;
        return 200 '{"status":"success","resultado":"Inferencia de Machine Learning completada en 12ms"}\n';
    }

    # Endpoint de monitorización exento de Rate Limiting
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","uptime":"100%"}\n';
    }
}
