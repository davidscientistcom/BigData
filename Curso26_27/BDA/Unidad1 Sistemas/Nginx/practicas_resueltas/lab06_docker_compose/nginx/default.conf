upstream backend_inference_cluster {
    # Resolución de nombres interna automática mediante el DNS de Docker
    server api_node_1:8000;
    server api_node_2:8000;
}

server {
    listen 80;
    server_name localhost;

    # Ocultar versión del servidor
    server_tokens off;

    # 1. FRONTEND: Servir Dashboard SPA estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Reverse Proxy balanceado hacia FastAPI
    location /api/ {
        proxy_pass http://backend_inference_cluster;

        # Inyección de identidad y metadatos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
