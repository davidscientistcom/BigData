server {
    listen 8080;
    server_name localhost;
    
    # Raíz donde se alojan los ficheros estáticos
    root ./html;
    index index.html;

    # Compresión dinámica con Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;

    # Ocultar versión del servidor en cabeceras HTTP
    server_tokens off;

    # Enrutamiento de recursos
    location / {
        try_files $uri $uri/ =404;
    }

    # Caché del navegador para assets estáticos
    location ~* \.(css|js|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Página de error 404 personalizada con directiva internal
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
