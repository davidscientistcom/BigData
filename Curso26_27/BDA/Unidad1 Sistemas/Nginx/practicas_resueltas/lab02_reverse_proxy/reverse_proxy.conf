server {
    listen 8080;
    server_name localhost;

    # Ruta enrutada hacia FastAPI
    location /api/ {
        # Paso al backend Uvicorn
        proxy_pass http://127.0.0.1:8000;

        # INYECCIÓN OBLIGATORIA DE CABECERAS DE IDENTIDAD
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive con el backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Ruta raíz con mensaje informativo
    location / {
        default_type text/html;
        return 200 '<h2>NGINX Reverse Proxy Activo</h2><p>Accede a <a href="/api/info">/api/info</a> para ver las cabeceras inyectadas hacia FastAPI.</p>\n';
    }
}
