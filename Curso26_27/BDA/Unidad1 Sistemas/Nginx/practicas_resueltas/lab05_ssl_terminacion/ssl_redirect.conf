# SERVIDOR 1: HTTP Inseguro (Puerto 8080)
# Redirección 301 Permanente hacia HTTPS
server {
    listen 8080;
    server_name localhost;

    # Forzar salto a HTTPS en el puerto 8443
    return 301 https://$host:8443$request_uri;
}

# SERVIDOR 2: HTTPS Seguro (Puerto 8443)
server {
    listen 8443 ssl;
    server_name localhost;

    # Rutas relativas o absolutas a los certificados
    ssl_certificate ./certs/server.crt;
    ssl_certificate_key ./certs/server.key;

    # Protocolos y cifrados modernos recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><body style="background:#0a0f1e;color:#10b981;font-family:sans-serif;padding:3rem;"><h1>🔒 Conexión Segura HTTPS Establecida</h1><p style="color:#cbd5e1;">NGINX ha desencriptado la conexión TLSv1.2/1.3 con éxito.</p></body></html>\n';
    }
}
